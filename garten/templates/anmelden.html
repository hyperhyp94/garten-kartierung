{% extends "base.html" %}
{% set ohne_leiste = true %}
{% block titel %}Anmelden · Garten{% endblock %}
{% block koerper %}seite-anmelden{% endblock %}
{% block inhalt %}
<main class="anmelden">
  <img class="anmelden-zeichen" src="{{ url_for('static', filename='icons/icon.svg') }}" alt="" width="72" height="72">
  <h1>Garten</h1>
  <p class="leise">Kartierung und Pflege in Feggendorf</p>

  <form method="post" class="karte-flaeche formular" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="weiter" value="{{ weiter }}">
    {% if fehler %}<p class="hinweis ist-fehler" role="alert">{{ fehler }}</p>{% endif %}
    <label class="feld">
      <span>Benutzername</span>
      <input name="benutzername" value="{{ benutzername }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required {% if not benutzername %}autofocus{% endif %}>
    </label>
    <label class="feld">
      <span>Passwort</span>
      <input name="passwort" type="password" autocomplete="current-password" required {% if benutzername %}autofocus{% endif %}>
    </label>
    <button class="knopf ist-haupt" type="submit">Anmelden</button>
  </form>
</main>
{% endblock %}
